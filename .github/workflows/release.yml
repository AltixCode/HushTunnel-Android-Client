name: Android Build & Play Store Release

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release Tag (e.g. v1.0.0)'
        required: false
        type: string
      release_title:
        description: 'Release Title'
        required: false
        type: string
        default: 'HushTunnel Android Release'
      is_prerelease:
        description: 'Mark as Pre-release'
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  id-token: write

# Google Play permits only one active edit at a time. Serializing release runs
# prevents two tags/manual runs from invalidating each other's Play edit.
concurrency:
  group: google-play-com.hushtunnel.app
  cancel-in-progress: false

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'
          fetch-depth: 0

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          log-accepted-android-sdk-licenses: false
          cmdline-tools-version: '14742923'
          packages: 'platforms;android-37.0 build-tools;37.0.0 platform-tools'

      - name: Install Android NDK
        run: |
          echo "y" | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            --channel=0 \
            --install "ndk;29.0.14206865"
          echo "NDK_HOME=$ANDROID_HOME/ndk/29.0.14206865" >> "$GITHUB_ENV"

      - name: Cache libhevtun
        id: cache-libhevtun
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/libs
          key: libhevtun-${{ runner.os }}-${{ env.NDK_HOME }}-${{ hashFiles('compile-hevtun.sh') }}

      - name: Build libhevtun
        if: steps.cache-libhevtun.outputs.cache-hit != 'true'
        run: |
          bash compile-hevtun.sh

      - name: Copy libhevtun to app
        run: |
          mkdir -p ${{ github.workspace }}/V2rayNG/app/libs
          if [ -d "${{ github.workspace }}/libs" ]; then
            cp -r "${{ github.workspace }}/libs/." "${{ github.workspace }}/V2rayNG/app/libs/" || true
          fi

      - name: Fetch AndroidLibXrayLite
        run: |
          if [ -d "AndroidLibXrayLite" ]; then
            pushd AndroidLibXrayLite
            CURRENT_TAG="$(git describe --tags --abbrev=0 2>/dev/null || echo "v2026.08.01")"
            echo "CURRENT_TAG=$CURRENT_TAG" >> "$GITHUB_ENV"
            popd
          else
            echo "CURRENT_TAG=v2026.08.01" >> "$GITHUB_ENV"
          fi

      - name: Download libv2ray binary
        uses: robinraju/release-downloader@v1.13
        continue-on-error: true
        with:
          repository: '2dust/AndroidLibXrayLite'
          tag: ${{ env.CURRENT_TAG }}
          fileName: 'libv2ray.aar'
          out-file-path: V2rayNG/app/libs/

      - name: Setup Java JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Compute Dynamic Version
        run: |
          COMMIT_COUNT="$(git rev-list --count HEAD)"
          BASE_VERSION_CODE=$((20000000 + GITHUB_RUN_NUMBER))
          # The Play Store variant applies the existing 4,000,000 output-code
          # offset in app/build.gradle.kts, so this is the code embedded in the
          # generated AAB. GITHUB_RUN_NUMBER keeps manual reruns unique too.
          VERSION_CODE=$((24000000 + GITHUB_RUN_NUMBER))
          echo "Computed Version: 1.0.$COMMIT_COUNT (Code: $VERSION_CODE)"
          {
            echo "APP_VERSION_NAME=1.0.$COMMIT_COUNT"
            echo "APP_BASE_VERSION_CODE=$BASE_VERSION_CODE"
            echo "APP_VERSION_CODE=$VERSION_CODE"
          } >> "$GITHUB_ENV"

      - name: Validate signing secrets
        env:
          APP_KEYSTORE_BASE64: ${{ secrets.APP_KEYSTORE_BASE64 }}
          APP_KEYSTORE_PASSWORD: ${{ secrets.APP_KEYSTORE_PASSWORD }}
          APP_KEYSTORE_ALIAS: ${{ secrets.APP_KEYSTORE_ALIAS }}
          APP_KEY_PASSWORD: ${{ secrets.APP_KEY_PASSWORD }}
        run: |
          missing=()
          [ -n "$APP_KEYSTORE_BASE64" ] || missing+=(APP_KEYSTORE_BASE64)
          [ -n "$APP_KEYSTORE_PASSWORD" ] || missing+=(APP_KEYSTORE_PASSWORD)
          [ -n "$APP_KEYSTORE_ALIAS" ] || missing+=(APP_KEYSTORE_ALIAS)
          [ -n "$APP_KEY_PASSWORD" ] || missing+=(APP_KEY_PASSWORD)
          if [ "${#missing[@]}" -ne 0 ]; then
            echo "::error::Missing required Android signing secrets: ${missing[*]}"
            exit 1
          fi

      - name: Configure Keystore
        id: keystore_setup
        env:
          APP_KEYSTORE_BASE64: ${{ secrets.APP_KEYSTORE_BASE64 }}
          APP_KEYSTORE_PASSWORD: ${{ secrets.APP_KEYSTORE_PASSWORD }}
          APP_KEYSTORE_ALIAS: ${{ secrets.APP_KEYSTORE_ALIAS }}
          APP_KEY_PASSWORD: ${{ secrets.APP_KEY_PASSWORD }}
        run: |
          mkdir -p "${{ github.workspace }}/keystore"
          printf '%s' "$APP_KEYSTORE_BASE64" | base64 --decode > "${{ github.workspace }}/keystore/release.jks"
          keytool -list -keystore "${{ github.workspace }}/keystore/release.jks" \
            -storepass "$APP_KEYSTORE_PASSWORD" -alias "$APP_KEYSTORE_ALIAS" >/dev/null
          {
            echo "KEYSTORE_PATH=${{ github.workspace }}/keystore/release.jks"
            echo "KEYSTORE_PASSWORD=$APP_KEYSTORE_PASSWORD"
            echo "KEY_ALIAS=$APP_KEYSTORE_ALIAS"
            echo "KEY_PASSWORD=$APP_KEY_PASSWORD"
          } >> "$GITHUB_ENV"

      - name: Build Release APKs & Google Play Bundle (AAB)
        run: |
          cd "${{ github.workspace }}/V2rayNG"
          echo "sdk.dir=${ANDROID_HOME}" > local.properties
          chmod +x gradlew
          
          # Build signed Play Store APKs
          ./gradlew assemblePlaystoreRelease \
            "-PhushVersionCode=$APP_BASE_VERSION_CODE" \
            "-PhushVersionName=$APP_VERSION_NAME" \
            "-Pandroid.injected.signing.store.file=$KEYSTORE_PATH" \
            "-Pandroid.injected.signing.store.password=$KEYSTORE_PASSWORD" \
            "-Pandroid.injected.signing.key.alias=$KEY_ALIAS" \
            "-Pandroid.injected.signing.key.password=$KEY_PASSWORD"

          # Build signed Play Store App Bundle (.aab)
          ./gradlew bundlePlaystoreRelease \
            "-PhushVersionCode=$APP_BASE_VERSION_CODE" \
            "-PhushVersionName=$APP_VERSION_NAME" \
            "-Pandroid.injected.signing.store.file=$KEYSTORE_PATH" \
            "-Pandroid.injected.signing.store.password=$KEYSTORE_PASSWORD" \
            "-Pandroid.injected.signing.key.alias=$KEY_ALIAS" \
            "-Pandroid.injected.signing.key.password=$KEY_PASSWORD"

      - name: Prepare Release Artifacts
        run: |
          mkdir -p ${{ github.workspace }}/release_artifacts
          VERSION="${{ env.APP_VERSION_NAME }}"
          
          # Collect Versioned & Generic APKs
          find ${{ github.workspace }}/V2rayNG/app/build/outputs/apk -name "*arm64-v8a*.apk" -exec cp {} ${{ github.workspace }}/release_artifacts/HushTunnel-${VERSION}-arm64-v8a.apk \; -quit || true
          find ${{ github.workspace }}/V2rayNG/app/build/outputs/apk -name "*armeabi-v7a*.apk" -exec cp {} ${{ github.workspace }}/release_artifacts/HushTunnel-${VERSION}-armeabi-v7a.apk \; -quit || true
          find ${{ github.workspace }}/V2rayNG/app/build/outputs/apk -name "*universal*.apk" -exec cp {} ${{ github.workspace }}/release_artifacts/HushTunnel-${VERSION}-universal.apk \; -quit || true
          find ${{ github.workspace }}/V2rayNG/app/build/outputs/apk -name "*x86_64*.apk" -exec cp {} ${{ github.workspace }}/release_artifacts/HushTunnel-${VERSION}-x86_64.apk \; -quit || true
          
          # Also create un-versioned aliases
          cp ${{ github.workspace }}/release_artifacts/HushTunnel-${VERSION}-universal.apk ${{ github.workspace }}/release_artifacts/HushTunnel-universal.apk || true

          # Collect Play Store AAB Bundle
          AAB_PATH=$(find ${{ github.workspace }}/V2rayNG/app/build/outputs/bundle -name "*.aab" -print -quit)
          if [ -z "$AAB_PATH" ]; then
            echo "::error::Play Store AAB was not produced"
            exit 1
          fi
          cp "$AAB_PATH" ${{ github.workspace }}/release_artifacts/HushTunnel-${VERSION}-playstore.aab

          ls -lh ${{ github.workspace }}/release_artifacts/

      - name: Validate Google Play authentication configuration
        env:
          GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          GCP_PLAY_SERVICE_ACCOUNT: ${{ vars.GCP_PLAY_SERVICE_ACCOUNT }}
        run: |
          [ -n "$GCP_WORKLOAD_IDENTITY_PROVIDER" ] || { echo "::error::Missing repository variable GCP_WORKLOAD_IDENTITY_PROVIDER"; exit 1; }
          [ -n "$GCP_PLAY_SERVICE_ACCOUNT" ] || { echo "::error::Missing repository variable GCP_PLAY_SERVICE_ACCOUNT"; exit 1; }

      - name: Authenticate to Google Cloud
        id: google_auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_PLAY_SERVICE_ACCOUNT }}
          create_credentials_file: true

      - name: Upload to Google Play Console
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5 # v1.1.5
        with:
          serviceAccountJson: ${{ steps.google_auth.outputs.credentials_file_path }}
          packageName: com.hushtunnel.app
          releaseFiles: ${{ github.workspace }}/release_artifacts/HushTunnel-${{ env.APP_VERSION_NAME }}-playstore.aab
          tracks: internal
          status: completed
          changesNotSentForReview: true
          releaseName: HushTunnel ${{ env.APP_VERSION_NAME }} (${{ env.APP_VERSION_CODE }})

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: HushTunnel-Android-Builds
          path: ${{ github.workspace }}/release_artifacts/*
          # Release IPAs/AABs are large; the retention workflow keeps only the newest two.
          retention-days: 14

      - name: Determine Release Tag
        id: tag_info
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ inputs.release_tag }}" ]; then
            TAG_NAME="${{ inputs.release_tag }}"
          elif [ "${{ startsWith(github.ref, 'refs/tags/') }}" = "true" ]; then
            TAG_NAME="${GITHUB_REF#refs/tags/}"
          else
            TAG_NAME="v${{ env.APP_VERSION_NAME }}"
          fi
          echo "TAG_NAME=$TAG_NAME" >> "$GITHUB_OUTPUT"

      - name: Generate Dynamic Release Notes
        run: |
          VERSION="${{ env.APP_VERSION_NAME }}"
          TAG="${{ steps.tag_info.outputs.TAG_NAME }}"
          BUILD="${{ env.APP_VERSION_CODE }}"

          # Generate SHA256 checksums
          cd "${{ github.workspace }}/release_artifacts"
          sha256sum ./*.apk ./*.aab > SHA256SUMS.txt 2>/dev/null || sha256sum ./* > SHA256SUMS.txt 2>/dev/null || true
          cd "${{ github.workspace }}"

          # Extract recent changelog
          CHANGELOG=$(git log --pretty=format:"* %s (%h)" -n 12)

          cat << 'HEADER_EOF' > ${{ github.workspace }}/RELEASE_NOTES.md
          ## 🛡️ HushTunnel Android ${TAG} (Build ${BUILD})

          ### 🚀 What's New & Key Highlights
          - **Full Persian (Farsi RTL) & 10 Locales**: Complete RTL typography, localized data units (گیگابایت/مگابایت), plan names, and pricing.
          - **Double-Entry Transactions Ledger**: Real-time balance debit/credit logs, plan payment breakdown, and complete audit trail.
          - **Responsive Viewport Navigation**: Fluid header layout with non-wrapping controls and horizontally scrollable tab navigation.
          - **Multi-Node Edge Switching**: Interactive server node switcher with dynamic latency checks and instant VLESS-Reality routing.
          - **Direct Subscription Provisioning**: High-speed OkHttp subscription fetch avoiding proxy startup delays.
          - **Store Billing Compliance**: Compliant account self-service linking directly to official control plane at [hushtunnel.com](https://www.hushtunnel.com).

          ### 📦 Download Packages
          | Package | Description | Target Architecture |
          |---|---|---|
          | **`HushTunnel-${VERSION}-universal.apk`** | Standalone Universal APK (Recommended) | All Android devices |
          | **`HushTunnel-${VERSION}-arm64-v8a.apk`** | 64-bit ARM Package | Modern Android Smartphones & Tablets |
          | **`HushTunnel-${VERSION}-armeabi-v7a.apk`** | 32-bit ARM Package | Legacy Android Devices |
          | **`HushTunnel-${VERSION}-x86_64.apk`** | 64-bit x86 Package | Android Emulators & Chromebooks |
          | **`HushTunnel-${VERSION}-playstore.aab`** | Google Play App Bundle | Google Play Store Distribution |

          ### 📝 Recent Changes
          HEADER_EOF

          {
            echo "$CHANGELOG"
            echo ""
            echo "### 🔒 Binary Integrity (SHA-256)"
            echo '```text'
            cat "${{ github.workspace }}/release_artifacts/SHA256SUMS.txt"
            echo '```'
          } >> "${{ github.workspace }}/RELEASE_NOTES.md"

          # Replace environment variables in generated file
          sed -i "s/\${TAG}/$TAG/g" ${{ github.workspace }}/RELEASE_NOTES.md
          sed -i "s/\${BUILD}/$BUILD/g" ${{ github.workspace }}/RELEASE_NOTES.md
          sed -i "s/\${VERSION}/$VERSION/g" ${{ github.workspace }}/RELEASE_NOTES.md

      - name: Create GitHub Release & Upload Binaries
        uses: softprops/action-gh-release@v2
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        with:
          tag_name: ${{ steps.tag_info.outputs.TAG_NAME }}
          name: ${{ inputs.release_title || steps.tag_info.outputs.TAG_NAME }}
          body_path: ${{ github.workspace }}/RELEASE_NOTES.md
          draft: false
          prerelease: ${{ inputs.is_prerelease || false }}
          files: ${{ github.workspace }}/release_artifacts/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
